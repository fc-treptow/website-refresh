# Vorübergehend: Probelauf der Übersetzung mit GitHub Models, ohne etwas zu speichern.
name: Übersetzen (Probelauf)
on:
  push:
    branches: [automatische-uebersetzung]
    paths: [.github/workflows/translate-probe.yml]
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Übersetzen (ohne Commit)
        run: node scripts/translate-content.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
      - name: Ergebnis als Hinweis ausgeben
        run: |
          for f in news/en/neuer-vorstand-2025 news/ar/neuer-vorstand-2025 news/tr/30-jahre-fc-treptow news/fr/gedenkturnier-wolfgang-doebler; do
            body=$(sed -n '/^---$/,$p' src/content/$f.md | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::notice title=$f::$body"
          done
