# Übersetzt Mannschaften und News automatisch über das Vercel AI Gateway
# (scripts/translate-content.mjs).
#
# Läuft, sobald im CMS ein deutscher Eintrag gespeichert wird (Push auf main unter
# src/content/teams/de oder src/content/news/de), und schreibt die Übersetzungen als eigenen
# Commit zurück. Vercel baut danach automatisch neu; nach ein, zwei Minuten sind alle Sprachen online.
#
# Voraussetzung: API-Schlüssel aus dem Vercel-Dashboard (AI Gateway → API Keys) als
# Repository-Secret AI_GATEWAY_API_KEY. Ohne Schlüssel läuft der Workflow durch und übersetzt nichts.
# Wird ein Limit erreicht, speichert der Workflow das bis dahin Übersetzte und der nächste Lauf
# holt den Rest nach.
# Optional: Repository-Variable TRANSLATE_MODEL, um ein bestimmtes Modell festzulegen.
#
# Von Hand starten (Actions → Übersetzen → Run workflow): übersetzt alles Fehlende oder Veraltete,
# mit "Alles neu übersetzen" auch alles andere.
name: Übersetzen

on:
  push:
    branches: [main]
    paths:
      - src/content/teams/de/**
      - src/content/news/de/**
      - scripts/translate-content.mjs
      - .github/workflows/translate.yml
  workflow_dispatch:
    inputs:
      force:
        description: Alles neu übersetzen (überschreibt auch von Hand verbesserte Übersetzungen)
        type: boolean
        default: false

permissions:
  contents: write

# Mehrere Speicherungen kurz hintereinander nacheinander abarbeiten, nicht abbrechen
concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    # Viele neue Beiträge auf einmal (z. B. ein Archiv-Import) brauchen deutlich länger als 10 Minuten.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Übersetzen
        # Läuft es zu lange, wird abgebrochen und trotzdem gespeichert, was schon fertig ist
        # (das Skript schreibt jede Datei sofort). Der nächste Lauf holt den Rest nach.
        timeout-minutes: 30
        continue-on-error: true
        run: node scripts/translate-content.mjs ${{ inputs.force && '--force' || '' }} | tee "$RUNNER_TEMP/bericht.txt"
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
      - name: Übersetzungen speichern
        run: |
          git add src/content/teams src/content/news
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          eintraege=$(git diff --cached --name-only | sed -E 's#.*/([^/]+)\.md#\1#' | sort -u | paste -sd ', ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -F - <<EOF
          Übersetzungen aktualisiert: $eintraege

          Automatisch über das Vercel AI Gateway aus dem deutschen Text übersetzt.

          $(cat "$RUNNER_TEMP/bericht.txt")
          EOF
          # Falls zwischendurch jemand im CMS gespeichert hat: auf den neuesten Stand setzen
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
