<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>FC Treptow | Redaktion</title>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!--
      Feste Version mit Prüfsumme (integrity): Der Browser lädt das CMS nur, wenn die Datei
      genau dieser Version entspricht. Schützt die Redaktion, falls unpkg oder das npm-Paket
      manipuliert würde. Zum Aktualisieren Version und Prüfsumme gemeinsam ändern, z. B.:
        npm pack decap-cms@X.Y.Z && tar xzf decap-cms-X.Y.Z.tgz
        echo "sha384-$(openssl dgst -sha384 -binary package/dist/decap-cms.js | base64 -w0)"
    -->
    <script
      src="https://unpkg.com/decap-cms@3.18.0/dist/decap-cms.js"
      integrity="sha384-Vu0vdYOBhK+2KywHCtNZ9sCqpzkwx358AT6pCSg8om/clLoDzpWYF41jrtEk/WMM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
