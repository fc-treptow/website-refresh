# Redaktion FC Treptow (Decap CMS)
#
# Anmeldung: per E-Mail und Passwort über DecapBridge (kein GitHub-Konto nötig).
# Einladungen und Passwörter verwaltet man unter decapbridge.com, Seite "FC Treptow".
# Jede gespeicherte Änderung landet im GitHub-Repository, Vercel baut die Seite danach
# automatisch neu. Nach etwa 1 bis 2 Minuten ist die Änderung online.
#
# Lokal testen: "npx decap-server" in einem zweiten Terminal, dann http://localhost:4321/admin

# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: fc-treptow/website-refresh
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/ad5e8fd0-57d6-407e-9d37-e8869f25a2e7/pkce
  auth_token_endpoint: /sites/ad5e8fd0-57d6-407e-9d37-e8869f25a2e7/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url


# Lokal (npx decap-server) ohne Anmeldung; in Produktion wird dieser Wert ignoriert,
# solange kein Server auf localhost:8081 antwortet.
local_backend: true

# Deutsche Oberfläche
locale: de
site_url: https://fct-website-refresh.vercel.app
display_url: https://fct-website-refresh.vercel.app
logo_url: /images/crest.png

# Fotos landen hier
media_folder: public/images/uploads
public_folder: /images/uploads

# Nur Deutsch pflegen. Übersetzungen sind freiwillig und liegen in eigenen Ordnern
# (src/content/news/en usw.). Fehlt eine Übersetzung, zeigt die Seite den deutschen Text.

collections:
  - name: news
    label: Neuigkeiten
    label_singular: Neuigkeit
    description: 'Beiträge für die Startseite und die News-Seite. Neueste zuerst.'
    folder: src/content/news/de
    create: true
    slug: '{{slug}}'
    sortable_fields: [date, title]
    summary: '{{title}}'
    fields:
      - { name: title, label: Überschrift, widget: string, hint: 'Kurz und klar, z. B. "River Plate steigt auf"' }
      - { name: date, label: Datum, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false, picker_utc: true }
      - { name: tag, label: Rubrik, widget: select, options: [Verein, Herren I, Herren II, Herren III, Freizeit, Goldenes Ticket], default: Verein }
      - { name: teaser, label: Kurztext, widget: text, hint: '1 bis 2 Sätze. Erscheint in der Übersicht unter der Überschrift.' }
      - { name: image, label: Foto, widget: image, required: false, hint: 'Querformat sieht am besten aus.' }
      - { name: body, label: Text, widget: markdown, buttons: [bold, italic, link, heading-two, bulleted-list, numbered-list], editor_components: [image], modes: [rich_text] }

  - name: teams
    label: Mannschaften
    label_singular: Mannschaft
    description: 'Trainingszeiten, Trainer, Fotos. Spielplan und Tabelle kommen automatisch von fussball.de.'
    folder: src/content/teams/de
    create: true
    slug: '{{slug}}'
    summary: '{{name}}  ·  {{league}}'
    fields:
      - { name: name, label: Name, widget: string, hint: 'z. B. FC Treptow II River Plate' }
      - { name: shortName, label: Kurzname, widget: string, hint: 'z. B. Herren II' }
      - { name: league, label: Liga, widget: string, hint: 'Genau so schreiben wie bei fussball.de, z. B. "Kreisliga B, Staffel 1". Für die Freizeitmannschaft: "Hobbymannschaft".' }
      - { name: order, label: Reihenfolge, widget: number, value_type: int, hint: '1 steht oben.' }
      - name: training
        label: Trainingszeiten
        label_singular: Trainingszeit
        widget: list
        summary: '{{fields.day}}, {{fields.from}} bis {{fields.to}}'
        fields:
          - { name: day, label: Tag, widget: select, options: [Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag] }
          - { name: from, label: Von, widget: string, hint: 'z. B. 19:30', pattern: ['^([01]?[0-9]|2[0-3]):[0-5][0-9]$', 'Bitte als Uhrzeit schreiben, z. B. 19:30'] }
          - { name: to, label: Bis, widget: string, hint: 'z. B. 21:00', pattern: ['^([01]?[0-9]|2[0-3]):[0-5][0-9]$', 'Bitte als Uhrzeit schreiben, z. B. 21:00'] }
      - name: staff
        label: Trainer und Ansprechpersonen
        label_singular: Person
        widget: list
        required: false
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Aufgabe, widget: select, options: [{ label: Trainer, value: coach }, { label: Co-Trainer, value: assistant }, { label: Teammanager, value: manager }] }
          - { name: phone, label: Telefon, widget: string, required: false, hint: 'Freiwillig. Wird auf der Seite anklickbar angezeigt.' }
      - { name: contact, label: Kontakt-E-Mail, widget: string, default: kontakt@fc-treptow.de }
      - { name: image, label: Mannschaftsfoto, widget: image, hint: 'Querformat, alle gut zu sehen.' }
      - { name: imageFocus, label: Bildausschnitt, widget: number, value_type: int, default: 50, min: 0, max: 100, hint: 'Nur ändern, wenn auf dem Foto Köpfe abgeschnitten sind. Kleinere Zahl zeigt mehr vom oberen Rand.' }
      - name: gallery
        label: Weitere Fotos
        label_singular: Foto
        widget: list
        required: false
        summary: '{{fields.alt}}'
        fields:
          - { name: src, label: Foto, widget: image }
          - { name: alt, label: Bildunterschrift, widget: string }
      - { name: fussballDeTeamId, label: fussball.de Team-ID, widget: string, required: false, pattern: ['^[0-9A-Z]{32}$', 'Die Team-ID hat genau 32 Zeichen (Ziffern und Großbuchstaben).'], hint: 'Nur einmal nötig und meist schon ausgefüllt. Leer lassen bei der Freizeitmannschaft.' }
      - { name: body, label: Beschreibung, widget: markdown, buttons: [bold, italic, link], editor_components: [], modes: [rich_text] }

  - name: vorstand
    label: Vorstand
    label_singular: Person
    description: 'Vorstand, Beisitzer, Kontrollrat und weitere Ämter.'
    folder: src/content/vorstand
    create: true
    slug: '{{name}}'
    summary: '{{name}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Amt, widget: select, options: [{ label: Vorsitzende/r, value: chair }, { label: 2. Vorsitzende/r, value: viceChair }, { label: Schatzmeister/in, value: treasurer }, { label: Schiedsrichterobmann/-frau, value: refereeLead }, { label: Beisitzer/in, value: assessor }, { label: Kontrollrat, value: controlBoard }, { label: Sonstiges, value: other }] }
      - { name: roleLabel, label: 'Bezeichnung (nur bei "Sonstiges")', widget: string, required: false, hint: 'z. B. Sportwart' }
      - { name: email, label: E-Mail, widget: string, required: false, hint: 'Beim Schiedsrichterobmann geht der Knopf "Beim Obmann melden" auf der Schiedsrichter-Seite an diese Adresse.' }
      - { name: phone, label: Telefon, widget: string, required: false }
      - { name: order, label: Reihenfolge, widget: number, value_type: int, default: 99, hint: '1 steht oben.' }

  - name: schiedsrichter
    label: Schiedsrichter
    label_singular: Schiedsrichter/in
    description: 'Das Schiedsrichter-Team auf der Seite /schiedsrichter. Den Obmann und seine E-Mail-Adresse für den Knopf "Beim Obmann melden" pflegst du unter Vorstand (Amt "Schiedsrichterobmann/-frau").'
    folder: src/content/schiedsrichter
    create: true
    slug: '{{name}}'
    summary: '{{name}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: order, label: Reihenfolge, widget: number, value_type: int, default: 99, hint: '1 steht oben.' }

  - name: sponsors
    label: Partner und Sponsoren
    label_singular: Partner
    folder: src/content/sponsors
    create: true
    slug: '{{name}}'
    summary: '{{name}}'
    fields:
      - { name: name, label: Name, widget: string }
      - { name: logo, label: Logo, widget: image, required: false, hint: 'Ohne Logo wird der Name angezeigt.' }
      - { name: url, label: Webseite, widget: string, required: false, pattern: ['^https?://.+', 'Mit https:// davor'] }
      - { name: tier, label: Art, widget: select, options: [Hauptsponsor, Partner], default: Partner }
      - { name: order, label: Reihenfolge, widget: number, value_type: int, default: 99 }

  - name: shop
    label: Fanshop-Artikel
    label_singular: Artikel
    description: 'Auswahl für die Fanshop-Seite. Bestellt wird im Spreadshirt-Shop.'
    folder: src/content/shop
    create: true
    slug: '{{name}}'
    summary: '{{name}}  ·  {{price}} €'
    fields:
      - { name: name, label: Name, widget: string }
      - { name: price, label: Preis in Euro, widget: number, value_type: float, step: 0.01 }
      - { name: url, label: Link zum Artikel im Shop, widget: string, pattern: ['^https://.+', 'Der Link muss mit https:// beginnen.'], hint: 'Artikel im Fanshop öffnen und die Adresse aus dem Browser kopieren.' }
      - { name: image, label: Produktfoto, widget: image, media_folder: /public/images/shop, public_folder: /images/shop }
      - { name: gallery, label: Weitere Ansichten, widget: list, required: false, field: { name: src, label: Foto, widget: image, media_folder: /public/images/shop, public_folder: /images/shop } }
      - { name: productType, label: Produktart, widget: string, required: false, hint: 'z. B. Kontrast-Hoodie' }
      - { name: sizes, label: Größen, widget: string, required: false, hint: 'z. B. S bis 3XL' }
      - { name: colours, label: Farben, widget: list, required: false, hint: 'Eine Farbe pro Eintrag' }
      - { name: order, label: Reihenfolge, widget: number, value_type: int, default: 99 }
      - { name: body, label: Beschreibung, widget: markdown, required: false, buttons: [bold, italic, bulleted-list], editor_components: [], modes: [rich_text], hint: 'Material, Passform, Pflege. Erscheint auf der Artikelseite.' }

  - name: downloads
    label: Downloads (PDF)
    label_singular: Dokument
    description: 'Formulare und Ordnungen zum Herunterladen.'
    folder: src/content/downloads
    create: true
    slug: '{{title}}'
    summary: '{{group}}  ·  {{title}}'
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: description, label: Kurze Beschreibung, widget: string, required: false }
      - { name: file, label: PDF-Datei, widget: file, media_folder: /public/downloads, public_folder: /downloads, choose_url: false }
      - { name: group, label: Bereich, widget: select, options: [Neue Mitglieder, Spielberechtigung, Vereinsordnungen] }
      - { name: order, label: Reihenfolge, widget: number, value_type: int, default: 99 }

  - name: gedenken
    label: In Gedenken
    label_singular: Nachruf
    folder: src/content/gedenken
    create: true
    slug: '{{name}}'
    summary: '{{name}}'
    fields:
      - { name: name, label: Name, widget: string }
      - { name: born, label: Geboren am, widget: datetime, required: false, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false, picker_utc: true }
      - { name: died, label: Gestorben am, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false, picker_utc: true }
      - { name: image, label: Foto, widget: image, required: false }
      - { name: body, label: Nachruf, widget: markdown, buttons: [bold, italic], editor_components: [], modes: [rich_text] }
      - { name: signature, label: Unterschrift, widget: string, default: 'Der Vorstand des FC Treptow e. V.' }

  - name: einstellungen
    label: Einstellungen
    description: 'Links zu externen Diensten. Nur ändern, wenn sich die Adresse wirklich geändert hat.'
    editor: { preview: false }
    files:
      - name: links
        label: Links
        file: src/content/einstellungen/links.yml
        format: yml
        fields:
          - name: applicationUrl
            label: Mitgliedsantrag (easyVerein)
            hint: 'Adresse des öffentlichen Antragsformulars, verlinkt auf der Seite Mitgliedschaft. In easyVerein unter Mitgliedsantrag zu finden, beginnt mit https://'
            widget: string
            pattern: ['^https://\S+$', 'Bitte eine vollständige Adresse eingeben, die mit https:// beginnt.']
          - name: memberAreaUrl
            label: Mitgliederbereich (easyVerein)
            hint: 'Login-Seite für Mitglieder, verlinkt in Kopfzeile, Menü, Fußzeile und auf der Seite Mitgliedschaft. Beginnt mit https://'
            widget: string
            pattern: ['^https://\S+$', 'Bitte eine vollständige Adresse eingeben, die mit https:// beginnt.']
          - name: appIosUrl
            label: easyVerein-App für iPhone (App Store)
            widget: string
            pattern: ['^https://\S+$', 'Bitte eine vollständige Adresse eingeben, die mit https:// beginnt.']
          - name: appAndroidUrl
            label: easyVerein-App für Android (Google Play)
            widget: string
            pattern: ['^https://\S+$', 'Bitte eine vollständige Adresse eingeben, die mit https:// beginnt.']
